services:
  backend:
    build: ./server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000', r => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY}
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy