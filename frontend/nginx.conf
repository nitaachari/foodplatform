server {
    listen 80;

    # Reverse proxy: the browser calls /api/... on ITS OWN origin
    # (this nginx server), and nginx forwards it to the backend
    # container over Docker's internal network. "backend" here is
    # the service name from docker-compose.yml, resolved via Docker's
    # built-in DNS — not localhost, not an IP address.
    #
    # Why bother, instead of the frontend calling the backend's port
    # directly? Same-origin means no CORS configuration needed in
    # production, and the backend's port never has to be exposed to
    # the outside world at all — only nginx (port 80) does.
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback. React Router handles routes like /orders/123
    # entirely client-side — that path doesn't exist as a real file.
    # Without this, refreshing the browser on /orders/123 asks nginx
    # for a file called "orders/123" that doesn't exist -> 404.
    # try_files checks for a real file first, and only falls back to
    # index.html (letting React Router take over) if nothing matches.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
